# compose.mcp.yaml — MCP server para integración LLM
#
# Activar en server/.env:
#   LLM=true
#   MCP_ENABLE=true
#   MCP_CONFIG='{"transport":"http","url":"http://127.0.0.1:3001/mcp/"}'
#
# El MCP server se arranca en modo dev con nvm — no tiene imagen Docker propia.
# Este override reserva el servicio para cuando se containerice.
# Por ahora arrancar manualmente:
#   cd mcp_server && nvm use 22 && npm run dev:http
#
# Uso (cuando esté containerizado):
#   docker compose \
#     -f infra/compose/compose.base.yaml \
#     -f infra/compose/compose.mcp.yaml up

services:
  MCP:
    image: 'node:22'
    user: 'node'
    working_dir: /home/node/app
    volumes:
      - ../../mcp_server/:/home/node/app
    command: 'npm run dev:http'
    network_mode: host
