# compose.mcp.yaml — MCP server para integración LLM
#
# Activar en server/.env:
#   LLM=true
#   MCP_ENABLE=true
#   MCP_CONFIG='{"transport":"http","url":"http://127.0.0.1:3001/mcp/"}'
#
# El MCP server (submódulo hermano: llm_planner_gcs/mcp_server) no tiene imagen propia: corre su código
# montado en node:22. Sin Docker: infra/tmuxinator/gcs-mcp.yml, o `cd ../mcp_server && nvm use && npm run dev:http`.
#
# Uso:
#   docker compose \
#     -f infra/compose/compose.base.yaml \
#     -f infra/compose/compose.mcp.yaml up

services:
  MCP:
    image: 'node:22'
    user: 'node'
    working_dir: /home/node/app
    volumes:
      - ../../../mcp_server/:/home/node/app
    command: 'npm run dev:http'
    network_mode: host
