# compose.planner.yaml — Planner MIP (FastAPI / solver PuLP-CBC)
#
# Requiere imagen construida desde mip_planner/:
#   cd mip_planner && docker build -t muavgcs:planner .
# Ver infra/README.md → Planner
#
# Activar en server/.env:
#   PLANNING_SERVER=true
#   PLANNING_HOST=http://127.0.0.1:8004
#
# Uso:
#   docker compose \
#     -f infra/compose/compose.base.yaml \
#     -f infra/compose/compose.planner.yaml up

services:
  Planner:
    image: 'muavgcs:planner'
    ports:
      - '8004:8004'
