# compose.planner.yaml — Smart-Flies-MUAVPlanner (Flask), el planner al que el GCS le pide misiones
# (`/mission_request`, `/get_plan`). NO es mip_planner: ese solo lo usa llm_mission_evaluator.
#
# Requiere imagen construida desde el submódulo hermano (su Dockerfile escucha en 8080):
#   cd ../Smart-Flies-MUAVPlanner && docker build -t muavgcs:planner .
# Ver infra/README.md → Planner
#
# Activar en server/.env:
#   PLANNING_SERVER=true
#   PLANNING_HOST=http://127.0.0.1:8004
#
# Uso:
#   docker compose \
#     -f infra/compose/compose.base.yaml \
#     -f infra/compose/compose.planner.yaml up

services:
  Planner:
    image: 'muavgcs:planner'
    ports:
      - '8004:8080'
