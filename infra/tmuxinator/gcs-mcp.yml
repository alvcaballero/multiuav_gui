<% gcs = ENV['GCS_DIR'] || `git rev-parse --show-toplevel`.strip %>
<% mcp = ENV['MCP_DIR'] || File.expand_path('../mcp_server', gcs) %>
# gcs-mcp.yml — backend + frontend + MCP server (flujo LLM completo)
# Requiere en server/.env: LLM=true, MCP_ENABLE=true
# El MCP es el submódulo hermano de llm_planner_gcs (MCP_DIR para otro lugar).
# Uso (desde cualquier carpeta del repo): tmuxinator start -p infra/tmuxinator/gcs-mcp.yml
name: gcs-mcp
root: <%= gcs %>
on_project_exit: tmux kill-session -t gcs-mcp

windows:
  - GCS:
      layout: main-vertical
      panes:
        - backend:
            - cd <%= gcs %>/server
            - nvm use && npm run server
        - mcp:
            - cd <%= mcp %>
            - nvm use && npm run dev:http
        - frontend:
            - cd <%= gcs %>/client
            - sleep 3; nvm use && npm run start
