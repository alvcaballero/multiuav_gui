<% gcs = File.expand_path('../..', __FILE__) %>
# gcs-simple.yml — backend + frontend, sin ROS ni Docker
# Uso: tmuxinator start -p infra/tmuxinator/gcs-simple.yml
name: gcs-simple
root: <%= gcs %>
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: main-vertical
      panes:
        - backend:
            - cd <%= gcs %>/server
            - nvm use 20
            - npm run server
        - frontend:
            - cd <%= gcs %>/client
            - nvm use 20
            - sleep 3
            - npm run start
