<% gcs = ENV['GCS_DIR'] || `git rev-parse --show-toplevel`.strip %>
# gcs-simple.yml — backend + frontend, sin ROS ni Docker
# Uso (desde cualquier carpeta del repo): tmuxinator start -p infra/tmuxinator/gcs-simple.yml
name: gcs-simple
root: <%= gcs %>
on_project_exit: tmux kill-session -t gcs-simple

windows:
  - GCS:
      layout: main-vertical
      panes:
        - backend:
            - cd <%= gcs %>/server
            - nvm use && npm run server
        - frontend:
            - cd <%= gcs %>/client
            - sleep 3; nvm use && npm run start
