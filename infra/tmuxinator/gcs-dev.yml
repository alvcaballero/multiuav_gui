<% gcs = ENV['GCS_DIR'] || `git rev-parse --show-toplevel`.strip %>
<% mcp = ENV['MCP_DIR'] || File.expand_path('../mcp_server', gcs) %>
<% compose = "docker compose -f #{gcs}/infra/compose/compose.base.yaml" %>
# gcs-dev.yml — stack completo de desarrollo con todo en Docker: GCS + ROS1 + Planner + MCP + rosbag
# Uso (desde cualquier carpeta del repo): tmuxinator start -p infra/tmuxinator/gcs-dev.yml
name: gcs-dev
root: <%= gcs %>
on_project_exit: tmux kill-session -t gcs-dev

windows:
  - GCS:
      layout: main-vertical
      panes:
        - backend:
            - cd <%= gcs %>/server
            - nvm use && npm run server
        - mcp:
            - cd <%= mcp %>
            - nvm use && npm run dev:http
        - frontend:
            - cd <%= gcs %>/client
            - sleep 3; nvm use && npm run start

  - Docker:
      layout: tiled
      panes:
        - rosbridge:
            - <%= compose %> -f <%= gcs %>/infra/compose/compose.ros1.yaml up RosBridge
        - planner:
            - <%= compose %> -f <%= gcs %>/infra/compose/compose.planner.yaml up Planner
        - video:
            - <%= compose %> up VideoServer
        - aux:
            - sleep 8
            - docker exec -it $(docker ps -qf "ancestor=muavgcs:ros1") bash

  - Bags:
      layout: tiled
      panes:
        - bag:
            - sleep 10
            - docker exec -it $(docker ps -qf "ancestor=muavgcs:ros1") bash -c "cd /home/user/bags && rosbag play -l <bag_file>.bag"
