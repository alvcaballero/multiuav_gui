<% gcs = ENV['GCS_DIR'] || `git rev-parse --show-toplevel`.strip %>
<% workspace = File.expand_path('..', gcs) %>
<% local_env = File.join(gcs, 'infra/local.env') %>
<% local = File.exist?(local_env) ? File.readlines(local_env).grep(/\A[A-Z0-9_]+=/).to_h { |l| l.chomp.split('=', 2) } : {} %>
<% need = ->(key) { File.expand_path(ENV[key] || local[key] || raise("gcs-full.yml: falta #{key} en infra/local.env (plantilla: infra/local.env.example)")) } %>
<% glyphserver = need.('GLYPHSERVER_DIR') %>
<% ros_docker = need.('ROS1_DOCKER_DIR') %>
<% tiles = need.('MAP_TILES_DIR') %>
# gcs-full.yml — stack completo de laburo diario: GCS + glyphserver + Smart-Flies + ROS 1 + video + mapa (martin)
# Uso (desde cualquier carpeta del repo): tmuxinator start -p infra/tmuxinator/gcs-full.yml
# Lo que vive fuera del repo sale de infra/local.env (una variable de entorno la pisa): GLYPHSERVER_DIR,
# ROS1_DOCKER_DIR (con su container_run.sh) y MAP_TILES_DIR (con tiles.mbtiles; infra/guides/offline-map.md).
name: gcs-full
root: <%= gcs %>
on_project_exit: tmux kill-session -t gcs-full

windows:
  - GCS:
      layout: main-vertical
      panes:
        - backend:
            - cd <%= gcs %>/server
            - nvm use && npm run server
        - glyphserver:
            - cd <%= glyphserver %>
            - nvm use 12 && npm start
        - frontend:
            - cd <%= gcs %>/client
            - sleep 5; nvm use && npm run start
        - planner:
            - cd <%= workspace %>/Smart-Flies-MUAVPlanner
            - uv run python -m flask --app ./api run --host=0.0.0.0 --port=8004
  - Docker:
      layout: tiled
      panes:
        - multimaster:
            - cd <%= ros_docker %>
            - ./container_run.sh
            - roslaunch aerialcore_gui connect_uas.launch
        - bag:
            - cd <%= ros_docker %>
            - ./container_run.sh
        - aux:
            - cd <%= ros_docker %>
            - ./container_run.sh
  - webrtc:
      layout: tiled
      panes:
        - video:
            - docker run --rm -it --network=host -v <%= gcs %>/server/config/mediamtx.yml:/mediamtx.yml bluenviron/mediamtx
        - tiles:
            - docker run --rm -p 8080:3000 -v <%= tiles %>:/files ghcr.io/maplibre/martin --webui enable-for-all /files/tiles.mbtiles
