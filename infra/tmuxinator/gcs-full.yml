<% gcs = ENV['GCS_DIR'] || `git rev-parse --show-toplevel`.strip %>
<% workspace = File.expand_path('..', gcs) %>
<% glyphserver = ENV['GLYPHSERVER_DIR'] || File.expand_path('~/work/px4/glyphserver') %>
<% ros_docker = ENV['ROS_DOCKER_DIR'] || File.expand_path('~/work/ros_docker_volume') %>
<% tiles = ENV['MAP_TILES_DIR'] || File.expand_path('~/work/data') %>
# gcs-full.yml — stack completo de laburo diario: GCS + glyphserver + Smart-Flies + ROS 1 + video + mapa (martin)
# Uso (desde cualquier carpeta del repo): tmuxinator start -p infra/tmuxinator/gcs-full.yml
# Lo que vive fuera del repo se pisa por variable de entorno:
#   GLYPHSERVER_DIR (default ~/work/px4/glyphserver), ROS_DOCKER_DIR (default ~/work/ros_docker_volume, con su
#   container_run.sh), MAP_TILES_DIR (default ~/work/data, con tiles.mbtiles; ver infra/guides/offline-map.md)
name: gcs-full
root: <%= gcs %>
on_project_exit: tmux kill-session -t gcs-full

windows:
  - GCS:
      layout: main-vertical
      panes:
        - backend:
            - cd <%= gcs %>/server
            - nvm use && npm run server
        - glyphserver:
            - cd <%= glyphserver %>
            - nvm use 12 && npm start
        - frontend:
            - cd <%= gcs %>/client
            - sleep 5; nvm use && npm run start
        - planner:
            - cd <%= workspace %>/Smart-Flies-MUAVPlanner
            - uv run python -m flask --app ./api run --host=0.0.0.0 --port=8004
  - Docker:
      layout: tiled
      panes:
        - multimaster:
            - cd <%= ros_docker %>
            - ./container_run.sh
            - roslaunch aerialcore_gui connect_uas.launch
        - bag:
            - cd <%= ros_docker %>
            - ./container_run.sh
        - aux:
            - cd <%= ros_docker %>
            - ./container_run.sh
  - webrtc:
      layout: tiled
      panes:
        - video:
            - docker run --rm -it --network=host -v <%= gcs %>/server/config/mediamtx.yml:/mediamtx.yml bluenviron/mediamtx
        - tiles:
            - docker run --rm -p 8080:3000 -v <%= tiles %>:/files ghcr.io/maplibre/martin --webui enable-for-all /files/tiles.mbtiles
