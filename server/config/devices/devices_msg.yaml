# Devices that talk robofleet (FlatBuffer): the robofleet topic is '/<device>' + `name`, as everywhere.
# Names are the ones fbDecode.js matches today (it only checks `includes`), so the bridge can keep
# publishing them; the slot of a message is looked up here by that topic. fbDecode still decodes by
# type + topic fragment, NOT through this block (see FlatbufferServer.js).
simulationFB:
  subscribers:
    position:
      name: '/gps_position'
      messageType: 'sensor_msgs/NavSatFix'
    heading:
      name: '/orientation'
      messageType: 'std_msgs/Float64'
    imu:
      name: '/imu'
      messageType: 'sensor_msgs/Imu'
    battery:
      name: '/battery_state'
      messageType: 'sensor_msgs/BatteryState'
    gimbal:
      name: '/gimbal'
      messageType: 'geometry_msgs/Vector3Stamped'
    speed:
      name: '/speed'
      messageType: 'geometry_msgs/Vector3Stamped'
    flight_status:
      name: '/flight_status'
      messageType: 'std_msgs/UInt8'
    display_mode:
      name: '/display_mode'
      messageType: 'std_msgs/UInt8'
    obstacle_info:
      name: '/obstacle_info'
      messageType: 'dji_osdk_ros/ObstacleInfo'
    mission_state:
      name: '/mission_state'
      messageType: 'dji_osdk_ros/WaypointV2MissionStatePush'
    threat:
      name: '/alarm'
      messageType: 'std_msgs/UInt8'
      watchdog: false # event-driven
  services: {}
# ─── MAVLink (protocol: mavlink) ─────────────────────────────────────────────────
# messageType `mavlink/<MESSAGE_NAME>` (models/mavlink): there are no topics, the vehicle is
# found by device.systemId. `rate_hz` is a stream the server asks for with SET_MESSAGE_INTERVAL
# when the vehicle comes online (and again while it is not arriving): ArduPilot sends no
# telemetry until asked, and PX4 sends position at ~50 Hz. Keep the rates low: a SiK radio
# carries ~1-2 KB/s. HEARTBEAT has no rate: it is always 1 Hz. PX4 vs ArduPilot differences
# travel in the HEARTBEAT (autopilot), not in the category. See MAVLINK_PLAN.md.
px4_mavlink:
  subscribers:
    vehicle_status:
      messageType: 'mavlink/HEARTBEAT'
    position_global:
      messageType: 'mavlink/GLOBAL_POSITION_INT'
      rate_hz: 4
    flight_status:
      messageType: 'mavlink/EXTENDED_SYS_STATE'
      rate_hz: 1
    battery:
      messageType: 'mavlink/BATTERY_STATUS'
      rate_hz: 1
    home_position:
      messageType: 'mavlink/HOME_POSITION'
      rate_hz: 0.5
    gimbal:
      messageType: 'mavlink/GIMBAL_DEVICE_ATTITUDE_STATUS'
      rate_hz: 2
    vehicle_command_ack:
      messageType: 'mavlink/COMMAND_ACK'
      watchdog: false # only sent as the answer to a command
  publishers:
    # The messageType is the dialect: PX4 reads the Takeoff altitude as AMSL and the reposition
    # yaw in radians (models/commands/mavlinkCommand.js). The server refuses to send if the
    # vehicle's heartbeat reports another autopilot.
    vehicle_command:
      messageType: 'mavlink/PX4_COMMAND'
  services:
    # MAVLink mission protocol upload (missionEncodeMavlink.js). Start = arm + AUTO.MISSION;
    # pause/stop = Hold; resume = AUTO.MISSION. Not ROS services: the key names the command.
    configure_mission:
      messageType: 'mavlink/PX4_MISSION'
    command_mission:
      messageType: 'mavlink/PX4_COMMAND'
    pause_mission:
      messageType: 'mavlink/PX4_COMMAND'
    resume_mission:
      messageType: 'mavlink/PX4_COMMAND'
    stop_mission:
      messageType: 'mavlink/PX4_COMMAND'
ardupilot_mavlink:
  subscribers:
    vehicle_status:
      messageType: 'mavlink/HEARTBEAT'
    position_global:
      messageType: 'mavlink/GLOBAL_POSITION_INT'
      rate_hz: 4
    flight_status:
      messageType: 'mavlink/EXTENDED_SYS_STATE'
      rate_hz: 1
    battery:
      messageType: 'mavlink/BATTERY_STATUS'
      rate_hz: 1
    home_position:
      messageType: 'mavlink/HOME_POSITION'
      rate_hz: 0.5
    vehicle_command_ack:
      messageType: 'mavlink/COMMAND_ACK'
      watchdog: false # only sent as the answer to a command
  publishers:
    # ArduCopter dialect: Takeoff altitude relative and only in GUIDED, reposition yaw ignored
    # (a CONDITION_YAW follows it). See models/commands/mavlinkCommand.js.
    vehicle_command:
      messageType: 'mavlink/ARDUPILOT_COMMAND'
  services:
    # MAVLink mission protocol upload (seq 0 is ArduPilot's home). Start = GUIDED + arm +
    # MISSION_START; pause/stop = BRAKE (never LOITER: it follows the throttle stick and descends
    # with no RC); resume = AUTO.
    configure_mission:
      messageType: 'mavlink/ARDUPILOT_MISSION'
    command_mission:
      messageType: 'mavlink/ARDUPILOT_COMMAND'
    pause_mission:
      messageType: 'mavlink/ARDUPILOT_COMMAND'
    resume_mission:
      messageType: 'mavlink/ARDUPILOT_COMMAND'
    stop_mission:
      messageType: 'mavlink/ARDUPILOT_COMMAND'
