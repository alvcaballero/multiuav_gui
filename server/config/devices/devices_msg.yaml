    command_mission:
      name: '/psdk_ros2/waypointV2_startMission'
      messageType: 'psdk_interfaces/srv/StartWaypointV2Mission'
    stop_mission:
      name: '/psdk_ros2/waypointV2_stopMission'
      messageType: 'psdk_interfaces/srv/StopWaypointV2Mission'
    resume_mission:
      name: '/psdk_ros2/waypointV2_resumeMission'
      messageType: 'psdk_interfaces/srv/ResumeWaypointV2Mission'
    pause_mission:
      name: '/psdk_ros2/waypointV2_pauseMission'
      messageType: 'psdk_interfaces/srv/PauseWaypointV2Mission'
