      messageType: 'geometry_msgs/msg/QuaternionStamped'
    battery:
      name: '/psdk_ros2/battery'
      messageType: 'sensor_msgs/msg/BatteryState'
      scale: 100 # percentage arrives as 0-1
    camera:
      name: '/video_stream_compress'
      messageType: 'sensor_msgs/CompressedImage'
    gimbal:
      name: '/psdk_ros2/gimbal_angles'
      messageType: 'geometry_msgs/msg/Vector3Stamped'
      unit: rad
    obstacle_info:
