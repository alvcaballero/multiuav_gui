# px4_mavros through a relay that runs ON THE DRONE: it republishes the telemetry under /slow/ at a
# lower rate, so only the slow topics cross the link (rosbridge runs next to the GCS and, in ROS 1, a
# subscriber gets every message of the topic it subscribes to). The relay also republishes the
# battery and mission messages as multiuav_interfaces/*, whose definition matches on both sides of a
# Melodic/Noetic link (a ROS 1 message whose md5sum differs does not connect).
# The /slow/ names must match the relay's launch on the drone.
extends: px4_mavros
subscribers:
  position:
    name: '/slow/gps_position'
  height_above_takeoff:
    name: '/slow/altitude'
  heading:
    name: '/slow/compass_hdg'
  speed:
    name: '/slow/velocity'
  battery:
    name: '/slow/battery'
    messageType: 'multiuav_interfaces/BatteryState'
  camera:
    name: '/slow/video_stream_compress'
services:
  configure_mission:
    messageType: 'multiuav_interfaces/ConfigMission'
