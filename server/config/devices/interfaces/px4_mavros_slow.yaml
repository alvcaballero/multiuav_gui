subscribers:
  position:
    name: '/gcs/gps_position'
    messageType: 'sensor_msgs/NavSatFix'
  height_above_takeoff:
    name: '/gcs/altitude'
    messageType: 'mavros_msgs/Altitude'
  heading:
    name: '/gcs/compass_hdg'
    messageType: 'std_msgs/Float64'
  speed:
    name: '/gcs/velocity'
    messageType: 'geometry_msgs/TwistStamped'
  battery:
    name: '/gcs/battery'
    messageType: 'multiuav_interfaces/BatteryState'
    scale: 100 # percentage arrives as 0-1
  camera:
    name: '/gcs/video_stream_compress'
    messageType: 'sensor_msgs/CompressedImage'
  threat:
    name: '/threat'
    messageType: 'std_msgs/Bool'
    watchdog: false # event-driven
services:
  configure_mission:
    name: '/mission/new'
    messageType: 'multiuav_interfaces/ConfigMission'
  command_mission:
    name: '/mission/start_stop'
    messageType: 'std_srvs/SetBool'
  sync_files:
    name: '/px4_mission_node/send_bags'
    messageType: 'std_srvs/Bool'
  camera_file_download:
    name: '/camera_download_files'
    messageType: 'dji_osdk_ros/DownloadMedia'
