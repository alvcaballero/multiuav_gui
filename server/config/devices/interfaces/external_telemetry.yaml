# Telemetry published by an external node on the vehicle's companion (plain /gps, /velocity,
# /compass_hdg, /battery: not mavros' own topic names). Was two interfaces, catec and fuvex, that only
# differed in the threat detection CATEC adds: that is a capability now (threat_detection), so the
# threat topic and services exist only for a device whose model has it.
firmwares: [ px4, ardupilot ]
vehicleTypes: [ multirotor, fixed_wing ]
control: companion
defaultModel: catec
subscribers:
  position:
    name: '/gps'
    messageType: 'sensor_msgs/NavSatFix'
  height_above_takeoff:
    name: '/mavros/altitude'
    messageType: 'mavros_msgs/Altitude'
  heading:
    name: '/compass_hdg'
    messageType: 'std_msgs/Float64'
  speed:
    name: '/velocity'
    messageType: 'geometry_msgs/TwistStamped'
  battery:
    name: '/battery'
    messageType: 'sensor_msgs/BatteryState'
    scale: 100 # percentage arrives as 0-1
  threat:
    name: '/threat'
    messageType: 'std_msgs/UInt8'
    watchdog: false # event-driven
services:
  threat_confirmation:
    name: '/threat_confirmation'
    messageType: 'std_srvs/Trigger'
  threat_defuse:
    name: '/threat_defuse'
    messageType: 'std_srvs/Trigger'
