firmwares: [ px4, ardupilot ]
vehicleTypes: [ fixed_wing ]
control: companion
subscribers:
  position:
    name: '/gps'
    messageType: 'sensor_msgs/NavSatFix'
  height_above_takeoff:
    name: '/mavros/altitude'
    messageType: 'mavros_msgs/Altitude'
  heading:
    name: '/compass_hdg'
    messageType: 'std_msgs/Float64'
  speed:
    name: '/velocity'
    messageType: 'geometry_msgs/TwistStamped'
  battery:
    name: '/battery'
    messageType: 'sensor_msgs/BatteryState'
    scale: 100 # percentage arrives as 0-1
services: {}
