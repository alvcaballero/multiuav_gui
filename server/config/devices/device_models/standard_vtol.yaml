# PX4's standard VTOL (quad plane): hovers on its lift rotors, cruises as a fixed wing.
vehicleType: vtol
firmware: [ px4 ]
interfaces: [ px4_mavros, px4_ros2, px4_mavlink ]
capabilities:
  autonomous_mission: standard
  flight_control: standard
  file_download: standard
  # No gimbal: a VTOL's camera, when it has one, is usually fixed to the airframe.
  camera: optional
  camera_stream: optional
label: 'Standard VTOL'
icon: plane
