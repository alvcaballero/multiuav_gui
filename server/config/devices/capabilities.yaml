# ─── Capability catalog (docs/decisions/vehicle-platforms.md › F3) ──────────────
#
# WHAT a vehicle can do, and which commands / telemetry slots implement it. A device model declares
# its capabilities (standard / optional); an interface IMPLEMENTS one when it declares an endpoint
# for one of its commands or one of its slots. A device has a capability when its model (plus its own
# overrides) says so AND its interface implements it; without it, the capability's commands are not
# offered nor sent, and its slots are not subscribed nor expected by the watchdog.
#
# A command or slot belongs to at most one capability. Anything not listed here (SaveHome, position,
# battery, heading…) is always there: it is what every device has.
#
# `mission` (mission_schema.yaml keys): the mission actions, route params and waypoint params the
# capability enables. A device without it is not offered them, and a mission using them is refused.
# An interface also implements a capability when its mission profile has one of these. What depends on
# the vehicle TYPE rather than on equipment (vtol_transition) is declared in mission_schema.yaml.
#
# `onboard: true`: equipment the vehicle carries; the GCS gives it no command nor mission item (it MAY
# read it through a telemetry slot). No interface implements it, so a device has it when its model
# declares it (and the device does not switch it off); a generic `'*'` model never gets it. What it is
# for: planning (which mission types a device can fly, what the planners are told) and, with a slot,
# watching it.

autonomous_mission:
  label: 'Autonomous missions'
  description: 'Loads and flies a waypoint mission on its own'
  commands: [LoadMission, CommandMission, UploadMission, PauseMission, ResumeMission, StopMission]
  slots: [mission_state]

flight_control:
  label: 'Flight commands'
  description: 'Takeoff, land, hold, return home, arm and move on command'
  commands: [Takeoff, Land, Hold, ReturnHome, Arm, Disarm, KillMotors, MoveRelative]

navigation:
  label: 'Navigation goals'
  description: 'Drives to a goal pose on its own (ground robots, Nav2)'
  commands: [NavigateToPose]

file_download:
  label: 'File download'
  description: 'Hands over the files it recorded (photos, logs)'
  commands: [CameraFileDownload, CameraFileList, SyncFiles]

gimbal:
  label: 'Gimbal'
  description: 'Points its camera on its own axis (a fixed camera has no gimbal)'
  commands: [Gimbal, GimbalPitch, ResetGimbal]
  slots: [gimbal]
  mission:
    actions: [gimbal]
    params: [mode_gimbal]
    waypoint_params: [gimbal]

camera:
  label: 'Camera'
  description: 'Takes photos and records video during a mission'
  mission:
    actions: [photo, video_start, video_stop, focus_camara, zoom_camera]

camera_stream:
  label: 'Camera stream'
  description: 'Sends live video to the GCS'
  commands: [SetupCamera]
  slots: [camera]

rtk:
  label: 'RTK positioning'
  slots: [position_rtk]

obstacle_sensing:
  label: 'Obstacle sensing'
  slots: [obstacle_info]

threat_detection:
  label: 'Threat detection'
  description: 'Reports threats and takes their confirmation / defuse'
  commands: [ThreatConfirmation, ThreatDefuse]
  slots: [threat]

humidity_sensor:
  label: 'Humidity sensor'
  slots: [humidity]

lidar_2d:
  label: '2D lidar'
  description: 'Scans a plane around it (ground robots: localization, obstacle avoidance)'
  onboard: true

# The sensor is equipment (`onboard`: a model that declares it carries it, an interface never "implements"
# it) AND the GCS can watch it: its slot is `on_demand` in the interface, so nothing subscribes until a
# viewer asks (models/lidar/). An interface without the slot still has the capability (the lidar is
# there, for planning); it just has nothing to stream.
lidar_3d:
  label: '3D lidar'
  description: 'Captures a point cloud of what it flies over (lidar inspection); the GCS can show it'
  onboard: true
  slots: [lidar_3d_points]
