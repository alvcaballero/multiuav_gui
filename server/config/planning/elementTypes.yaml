# Static element types — tracked in git.
# These are the built-in inspection target types available to all users.
# Custom user-defined types live in server/data/markerTypes.yaml (gitignored).

- id: powerTower
  name: Power Tower
  icon: /api/markers/types/powerTower/icon
  model3d: /api/markers/types/powerTower/model
  color: blue
  description: 'Torre eléctrica'
  attributes:
    geometry:
      geometry_type: circle
      dimensions:
        radius: 1.5
        height: 15

- id: windTurbine
  name: Wind Turbine
  icon: /api/markers/types/windTurbine/icon
  model3d: /api/markers/types/windTurbine/model
  definitionYaml: /api/markers/types/windTurbine/definition
  color: red
  description: 'Aerogenerador'
  attributes:
    geometry:
      geometry_type: circle
      dimensions:
        radius: 28
        height: 108

- id: goliathCrane
  name: Goliath Crane
  # No icon/model3d yet — nobody's uploaded 2D/3D assets for this one. No
  # `attributes.geometry` either, and deliberately so: this is a multi-link
  # structure (twin box girders, two legs, two trolleys/hoists) with no
  # single natural bounding radius/box the way a tower or panel has — making
  # one up would be a fabricated collision envelope for a 1000 t crane. A
  # real bounding shape needs either a manual GeometryFields entry (a
  # deliberately conservative box) or the parametric-geometry derivation
  # this catalog defers to a later pass (see definitionYaml's `links`).
  definitionYaml: /api/markers/types/goliathCrane/definition
  color: purple
  description: 'Grúa pórtico Goliath (doble viga, dique seco)'

- id: solarPanel
  name: Solar Panel
  icon: /api/markers/types/solarPanel/icon
  model3d: /api/markers/types/solarPanel/model
  color: green
  description: 'Panel solar'
  attributes:
    geometry:
      geometry_type: rectangle
      dimensions:
        width: 20
        length: 20
        height: 2
